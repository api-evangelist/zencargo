}

type PurchaseOrderConnection {
  nodes: [PurchaseOrder!]
  edges: [PurchaseOrderEdge!]
  pageInfo: PageInfo!
  totalCount: Int
}

type PurchaseOrderEdge {
  cursor: String!
  node: PurchaseOrder
}

type ProductConnection {
  nodes: [Product!]
  edges: [ProductEdge!]
  pageInfo: PageInfo!
  totalCount: Int
}

type ProductEdge {
  cursor: String!
  node: Product
}

type CoreProductConnection {
  nodes: [CoreProduct!]
  edges: [CoreProductEdge!]
  pageInfo: PageInfo!
  totalCount: Int
}

type CoreProductEdge {
  cursor: String!
  node: CoreProduct
}

type CoreProductCategoryConnection {
  nodes: [CoreProductCategory!]
  pageInfo: PageInfo!
  totalCount: Int
}

type CoreProductAttributeConnection {
  nodes: [CoreProductAttribute!]
  pageInfo: PageInfo!
  totalCount: Int
}

type PackingListConnection {
  nodes: [PackingList!]
  pageInfo: PageInfo!
  totalCount: Int
}

type LotConnection {
  nodes: [Lot!]
  edges: [LotEdge!]
  pageInfo: PageInfo!
  totalCount: Int
}

type LotEdge {
  cursor: String!
  node: Lot
}

type AccountLocationConnection {
  nodes: [AccountLocation!]
  pageInfo: PageInfo!
  totalCount: Int
}

type AccountConnectionTypeConnection {
  nodes: [AccountConnectionType!]
  pageInfo: PageInfo!
  totalCount: Int
}

