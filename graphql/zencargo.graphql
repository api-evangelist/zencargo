# ─────────────────────────────────────────────
# Query root
# ─────────────────────────────────────────────

type QueryRoot {
  "Retrieve an account by its UUID, with nested locations and products."
  account(uuid: String!): Account

  "Search accounts assignable to the given account (customers, suppliers, ...)."
  searchAssignableAccounts(
    accountId: String!
    searchAssignableAccountsFiltersInput: SearchAssignableAccountsFiltersInput!
  ): AccountConnectionTypeConnection

  "List / filter products for the authenticated account."
  products(first: Int, after: String, nameContains: String): ProductConnection

  "List core products (catalog with characteristics, attributes, pricing)."
  coreProducts(first: Int, after: String): CoreProductConnection

  "List product categories."
  coreProductCategories(first: Int, after: String): CoreProductCategoryConnection

  "List product attributes."
  coreProductAttributes(first: Int, after: String): CoreProductAttributeConnection

  "Retrieve a single purchase order by reference."
  purchaseOrder(orderReferenceNumber: String!): PurchaseOrder

  "List / filter purchase orders."
  purchaseOrders(first: Int, after: String): PurchaseOrderConnection

  "Query bookings, optionally filtered by Zencargo references."
  bookings(zencargoReferences: [String!], first: Int, after: String): BookingConnection

  "Query packing lists for a booking or a specific cargo."
  packingLists(findBy: PackingListFindBy!): PackingListConnection
}

# ─────────────────────────────────────────────
# Mutation root
# ─────────────────────────────────────────────

type Mutation {
  # Products (legacy product surface)
  productsCreateProduct(input: CreateProductInput!): CreateProductPayload
  productsUpdateProduct(input: UpdateProductInput!): UpdateProductPayload
  productsArchiveProduct(input: ArchiveProductInput!): ArchiveProductPayload
  productsUnarchiveProduct(input: UnarchiveProductInput!): UnarchiveProductPayload

  # Core products
  createCoreProduct(input: CreateCoreProductInput!): CreateCoreProductPayload
  updateCoreProduct(input: UpdateCoreProductInput!): UpdateCoreProductPayload
  archiveCoreProduct(input: ArchiveCoreProductInput!): ArchiveCoreProductPayload
  unarchiveCoreProduct(input: UnarchiveCoreProductInput!): UnarchiveCoreProductPayload

  # Categories
  createCoreProductCategory(input: CreateCoreProductCategoryInput!): CreateCoreProductCategoryPayload
  updateCoreProductCategory(input: UpdateCoreProductCategoryInput!): UpdateCoreProductCategoryPayload
  deleteCoreProductCategory(input: DeleteCoreProductCategoryInput!): DeleteCoreProductCategoryPayload

  # Attributes
  createCoreProductAttribute(input: CreateCoreProductAttributeInput!): CreateCoreProductAttributePayload
  updateCoreProductAttribute(input: UpdateCoreProductAttributeInput!): UpdateCoreProductAttributePayload
  deleteCoreProductAttribute(input: DeleteCoreProductAttributeInput!): DeleteCoreProductAttributePayload

  # Purchase orders & lots
  purchaseOrdersCreateOrder(input: CreateOrderInput!): CreateOrderPayload
  purchaseOrdersUpdateOrder(input: UpdateOrderInput!): UpdateOrderPayload
  purchaseOrdersCloseOrder(input: ClosePurchaseOrderInput!): ClosePurchaseOrderPayload
  purchaseOrdersDeleteOrder(input: DeleteOrderInput!): DeleteOrderPayload
  purchaseOrdersUpdateLots(input: UpdateLotsInput!): UpdateLotsPayload
  purchaseOrdersUpdateLotEstimates(input: UpdateLotEstimatesInput!): UpdateLotEstimatesPayload
}

# Zencargo names the query root type "QueryRoot" (per the documented reference).
schema {
  query: QueryRoot
  mutation: Mutation
}
