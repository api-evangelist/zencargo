"""
Zencargo GraphQL API — representative SDL.

Zencargo exposes a single GraphQL API for its digital freight forwarding and
supply-chain visibility platform. All operations are HTTPS POST requests to one
per-tenant endpoint:

    https://{accountReference}.api.{environment}.zencargo.com/graphql

Authentication is HTTP Basic (API Key ID as username, secret as password),
sent as `Authorization: Basic base64(keyId:secret)`.

This SDL is grounded in the public API documentation at
https://api-docs.zencargo.com (queries, mutations, object types, and enums are
transcribed from the documented schema). It is a representative, hand-authored
schema: field sets for the largest objects are trimmed to the documented,
load-bearing fields, and some scalar/enum value lists are partial where the
upstream reference paginates long enumerations. The live schema is
introspectable only with tenant credentials via the in-app API Console, so this
document should be treated as an accurate model rather than a byte-for-byte
export. No Subscription type is documented; realtime updates are delivered via
HTTP webhooks (see /webhooks), not GraphQL subscriptions over WebSocket.
"""

# ─────────────────────────────────────────────
# Scalars (documented custom scalars)
# ─────────────────────────────────────────────

scalar LocalDateTimeType
scalar LocalDateTimeWithNoTimeZone
scalar RichDateTime
scalar ISO8601Date
scalar BigDecimal

# ─────────────────────────────────────────────
# Enums (documented)
# ─────────────────────────────────────────────

enum CoreModeOfTransport {
  AIR
  OCEAN
  RAIL
  ROAD
}

"Main mode of transport for a booking."
enum ModeOfTransport {
  OCEAN
  AIR
  RAIL
  ROAD
}

enum ScheduledModeOfTransportEnum {
  OCEAN
  AIR
  RAIL
  ROAD
  TRUCK
}

enum BookingStageEnum {
  BOOKING_REQUESTED
  BOOKING_RECEIVED
  BOOKING_CONFIRMED
}

"Named milestones tracked along a voyage."
enum VoyageMilestoneNameEnum {
  collected
  gate_in
  cargo_aboard
  departed_origin_terminal
  arrived_at_destination_terminal
  cargo_unloaded
  gate_out
  gate_out_empty
  delivered
}

enum IncotermsValue {
  exworks
  fca
  fas
  fob
  cfr
  cif
  cpt
  cip
  dap
  dat
  ddp
}

enum LoadTypeEnum {
  CY_CY
  CFS_CY
  CFS_CFS
}

enum MilestoneEstimateDateType {
  ESTIMATED
  CONFIRMED
  ACTUAL
}

"Shipment type (e.g. full container load vs. less than container load)."
enum Shipment {
  FCL
  LCL
  FTL
  LTL
}

enum TradeRole {
  IMPORTER
  EXPORTER
  BROKER
}

enum PackingListFindByEnum {
  BOOKING_REFERENCE
  CARGO_ID
}

enum CoreProductStatus {
  ACTIVE
  ARCHIVED
}

enum CargoItemTypeEnum {
  CONTAINER
  LOOSE_CARGO
  VEHICLE
}

enum SortingOrder {
  ASCENDING
  DESCENDING
}

enum AccountConnectionTypeEnum {
  CUSTOMER
  SUPPLIER
  MANUFACTURER
  FORWARDER
}

# Long enumerations (Currency, CountryCode, RegionCode, ...) are documented in
# full at https://api-docs.zencargo.com/enum/ ; representative members below.

enum Currency {
  GBP
  USD
  EUR
  CNY
}

enum CountryCode {
  GB
  US
  CN
  DE
  NL
}

# ─────────────────────────────────────────────
# Interfaces (documented)
# ─────────────────────────────────────────────

"An assignable network party — a company, organisation, or location label."
interface NetworksAssignableInterface {
  label: NetworksLabelType
}

# ─────────────────────────────────────────────
# Shared value objects
# ─────────────────────────────────────────────

type NetworksLabelType {
  short: String
  long: String
}

type NetworksOrgLoc implements NetworksAssignableInterface {
  label: NetworksLabelType
  organisationId: String
  locationId: String
}

type Address {
  addressLine1: String
  addressLine2: String
  city: String
  region: String
  postalCode: String
  countryCode: CountryCode
}

type Money {
  value: Float
  currency: Currency
}

type MoneyWithBigDecimalValue {
  value: BigDecimal
  currency: Currency
}

type MetricValue {
  value: Float
  unit: String
}

type RichDate {
  date: ISO8601Date
}

type PerUnitCbm {
  value: Float
  source: String
}

type Incoterms {
  value: IncotermsValue
  location: String
}

type UpdatedBy {
  id: String
  name: String
}

type LastUpdated {
  at: RichDateTime
  by: UpdatedBy
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# ─────────────────────────────────────────────
# Bookings & shipment visibility
# ─────────────────────────────────────────────

type Booking {
  "Booking identifier at Zencargo."
  zencargoReference: String!
  "Scheduled carriage legs, ordered chronologically; null if not applicable."
  scheduledLegs: [ScheduledLeg]
  "Journey detail for cargos on this booking; empty for customs-only bookings."
  cargoJourneyDetails: [CargoJourneyDetail]!
  bookingDocuments: [BookingDocument!]!
  bookingStage: BookingStage
  cargo: Cargo
  consignee: NetworksAssignableInterface
  consignor: NetworksAssignableInterface
  customer: BookingCustomerType
  forwarder: NetworksAssignableInterface
  forwarderReference: String
  houseBillOfLading: String
  masterBillOfLading: String
  incoterms: Incoterms
  loadType: LoadTypeEnum
  modeOfTransport: ModeOfTransport
  shipmentType: Shipment
  tradeRole: TradeRole
  networksOrigin: NetworksAssignableInterface
  networksDestination: NetworksAssignableInterface
  requiredDeliveryDate: RichDate
  estimatedArrival: LocalDateTimeType
  estimatedDeparture: LocalDateTimeType
  estimatedCollection: LocalDateTimeType
  estimatedDelivery: LocalDateTimeType
  "Current voyage milestone (deprecated in favour of scheduledLegs)."
  voyageMilestone: VoyageMilestone
  lots(after: String, before: String, first: Int, last: Int): LotConnection
}

type BookingCustomerType implements NetworksAssignableInterface {
  label: NetworksLabelType
  accountUuid: String
}

type BookingStage {
  value: BookingStageEnum
  name: String
}

type BookingDocument {
  documentType: String
  description: String
  assetUrl: String
}

type ScheduledLeg {
  fromTerminal: TransportTerminal
  toTerminal: TransportTerminal
  estimatedDepartureDate: ISO8601Date
  estimatedArrivalDate: ISO8601Date
  actualDepartureLocalDateTime: LocalDateTimeWithNoTimeZone
  actualArrivalLocalDateTime: LocalDateTimeWithNoTimeZone
  modeOfTransport: ScheduledModeOfTransportEnum
}

type CargoJourneyDetail {
  cargoId: String
  collectionStop: AccountLocation
  estimatedCollectionDateTime: LocalDateTimeWithNoTimeZone
  estimatedCollectionDateType: MilestoneEstimateDateType
  actualCollectionDateTime: LocalDateTimeWithNoTimeZone
  deliveryStop: AccountLocation
  estimatedDeliveryDateTime: LocalDateTimeWithNoTimeZone
  estimatedDeliveryDateType: MilestoneEstimateDateType
  actualDeliveryDateTime: LocalDateTimeWithNoTimeZone
}

type VoyageMilestone {
  id: String!
  name: VoyageMilestoneNameEnum!
  actual: LocalDateTimeType
  latestEstimate: LocalDateTimeType
  originalEstimate: LocalDateTimeType
  current: Boolean!
  occurred: Boolean!
  primary: Boolean!
  portName: String
  vesselName: String
  location: NetworksAssignableInterface
  updatedAt: RichDateTime!
  updatedBy: UpdatedBy
}

type Terminal {
  name: String
  unlocode: String
}

type TransportTerminal {
  name: String
  unlocode: String
  terminalType: String
  countryCode: CountryCode
}

type Delay {
  items: [DelayItem]
}

type DelayItem {
  reason: String
  days: Int
}

# ─────────────────────────────────────────────
# Cargo & packing lists
# ─────────────────────────────────────────────

type Cargo {
  cargoItemType: CargoItemTypeEnum
  grossWeight: MetricValue
  totalCbm: Float
}

type PackingList {
  cargo: Cargo
  lines: [PackingListLine!]
}

type PackingListLine {
  lot: Lot
  quantity: Int
  cbm: Float
}

# ─────────────────────────────────────────────
# Purchase orders, ordered line items, and lots
# ─────────────────────────────────────────────

type PurchaseOrder {
  id: String
  orderReferenceNumber: String
  orderDate: ISO8601Date
  manufacturer: NetworksAssignableInterface
  origin: AccountLocation
  destination: AccountLocation
  orderedLineItems: [OrderedLineItem!]
