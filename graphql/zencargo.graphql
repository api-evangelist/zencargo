  reasonForChange: ReasonForChange
  lastUpdated: LastUpdated
}

type ReasonForChange {
  code: String
  description: String
}

# ─────────────────────────────────────────────
# Products, categories, attributes
# ─────────────────────────────────────────────

type Product {
  id: String
  name: String
  skuCode: String
  properties: [ProductProperty!]
  category: ProductCategory
}

type ProductProperty {
  name: String
  value: String
}

type ProductCategory {
  id: String
  name: String
}

type CoreProduct {
  id: String
  name: String
  skuCode: String
