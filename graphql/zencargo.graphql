}

# ─────────────────────────────────────────────
# Accounts & locations
# ─────────────────────────────────────────────

type Account implements NetworksAssignableInterface {
  uuid: String
  label: NetworksLabelType
  status: String
  accountType: String
  billingDetails: AccountBillingDetails
  contactDetails: AccountContactDetails
  legalInformation: AccountLegalInformation
  locations(first: Int, after: String): AccountLocationConnection
  products(first: Int, after: String, nameContains: String): ProductConnection
}

type AccountBillingDetails {
  currency: Currency
  address: Address
}

type AccountContactDetails {
  email: String
  phone: String
}

type AccountLegalInformation {
  registrationNumber: String
  vatNumber: String
}

type AccountLocation implements NetworksAssignableInterface {
  id: String
  label: NetworksLabelType
  address: Address
  countryCode: CountryCode
}

type AccountConnectionType {
  account: Account
  connectionType: AccountConnectionTypeEnum
}

# ─────────────────────────────────────────────
