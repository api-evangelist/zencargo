name: Zencargo
kind: company
description: Zencargo is a digital freight forwarder and supply-chain visibility
  platform for ocean, air, road, and rail shipments. Its GraphQL API gives
  enterprise customers programmatic access to bookings, shipment tracking and
  voyage milestones, purchase orders, products, packing lists, and accounts, plus
  HTTP webhooks for booking and purchase-order events. The API is
  customer-provisioned - each account is issued a dedicated staging and
  production endpoint and API-key credentials by their Zencargo account manager.
